/* inspection screen */
function stp(it,r){return '<div class="step"><button data-a="cdec" data-i="'+it.id+'" aria-label="Less">−</button><span class="num">'+(r.n==null?'–':r.n)+'</span><button data-a="cinc" data-i="'+it.id+'" aria-label="More">+</button></div>';}
function row(i,it){
  var r=i.res[it.id]||{},ov=r.fix==='overridden';
  var re=i.status==='reinspect'&&r.fix&&r.fix!=='open';
  var cls=r.r||'',ctl='',sub='',stk='',tap=false;
  var lbl=esc(it.label)+(it.type==='swap'?' <small>swap · laundry</small>':'')+(it.type==='count'&&it.unit?' <small>'+esc(it.unit)+'</small>':'');
  var pf='<button class="b p'+(r.r==='pass'?' on':'')+'" data-a="pass" data-i="'+it.id+'">Pass</button><button class="b f'+(r.r==='fail'?' on':'')+'" data-a="fail" data-i="'+it.id+'">Fail</button><button class="b n'+(r.r==='na'?' on':'')+'" data-a="na" data-i="'+it.id+'" aria-label="Not applicable">N/A</button>';
  if(ov){
    cls='ovr';stk=' stk';
    ctl='<button class="b p" data-a="pass" data-i="'+it.id+'">Pass</button><button class="b n" data-a="unovr" data-i="'+it.id+'">Undo override</button>';
    sub='<small>Overridden: '+esc(r.ovr||'accepted as is')+'</small>';
  } else if(re){
    cls=r.r==='pass'?'pass':(r.fix==='refailed'?'fail':'fix');stk=' stk';
    ctl='<button class="b p'+(r.r==='pass'?' on':'')+'" data-a="pass" data-i="'+it.id+'">Pass</button><button class="b f'+(r.fix==='refailed'?' on':'')+'" data-a="fail" data-i="'+it.id+'">Still failing</button>'+(r.r==='fail'?'<button class="b o" data-a="ovr" data-i="'+it.id+'">Override</button>':'');
    sub='<small class="'+(r.fix==='refailed'?'bad':'')+'">'+esc((r.note||r.auto||'').trim()||'Was failing; marked fixed')+'</small>';
  } else if(it.type==='count'){
    stk=' stk';ctl=stp(it,r)+pf;
    if(r.r==='fail')sub='<small class="bad">'+esc((r.note||r.auto||'No note').trim())+'</small>';
  } else {
    ctl=pf;tap=true;
    if(r.r==='fail')sub='<small class="bad">'+esc((r.note||r.auto||'No note').trim())+'</small>';
    if(it.type==='swap'&&r.r==='pass')sub='<small>Laundry sent <span class="step sm" style="display:inline-flex;vertical-align:middle"><button data-a="ldec" data-i="'+it.id+'" aria-label="Less laundry">−</button><span class="num">'+(r.laundry==null?'–':r.laundry)+'</span><button data-a="linc" data-i="'+it.id+'" aria-label="More laundry">+</button></span></small>';
  }
  var lab=tap?'<button class="lbl" data-a="pass" data-i="'+it.id+'"><span>'+lbl+'</span>'+sub+'</button>':'<div class="lbl"><span>'+lbl+'</span>'+sub+'</div>';
  return '<div class="row '+cls+stk+'">'+lab+'<div class="ctl">'+ctl+'</div></div>';
}
function checklist(i){
  var re=i.status==='reinspect';

function ritemsSheet(sh){

  else{block=blockOf(sh.id);own=block;title=block.name+': items for every room';scopeKey='block:'+block.id;}
